version: 2
updates:
  # Librerie npm del backend
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      aggiornamenti-minori:
        update-types: ["minor", "patch"]

  # Librerie npm del frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      aggiornamenti-minori:
        update-types: ["minor", "patch"]

  # Immagini base nei Dockerfile (FROM node:..., FROM nginx:...)
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Versioni delle azioni nei workflow (actions/checkout@v4, ...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
