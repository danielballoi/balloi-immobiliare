server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Upload CSV: il backend accetta fino a 50 MB (default nginx: 1 MB, darebbe errore 413)
  client_max_body_size 50m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Le chiamate /api vanno al backend (il nome "backend" lo risolve Docker Compose)
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # File con hash nel nome (generati da Vite): cache lunga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single Page Application: ogni altra route torna a index.html
  location / {
    try_files $uri /index.html;
  }
}
